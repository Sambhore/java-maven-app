version: 0.2

phases:
  install:
    commands:
      - echo "Installing Maven..."
      - mvn --version
  build:
    commands:
      - echo "Building WAR package..."
      - mvn clean package -DskipTests
      - mv target/maven-cloudaseem-app.war target/ROOT.war
artifacts:
  files:
    - target/maven-cloudaseem-app.war
    - appspec.yml
    - scripts/**        # your deployment scripts if any
