version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17
    commands:
      - echo "Installing dependencies..."
      - mvn clean install -DskipTests
  build:
    commands:
      - echo "Building the Java project..."
      - mvn package -DskipTests
  post_build:
    commands:
      - echo "Build completed successfully on $(date)"
      - ls -lh target/
artifacts:
  files:
    - target/*.war
  discard-paths: yes
  base-directory: target
cache:
  paths:
    - '/root/.m2/**/*'
